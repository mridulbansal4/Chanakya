services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: chanakya-backend:latest
    container_name: chanakya_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: chanakya-frontend:latest
    container_name: chanakya_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - backend
    restart: unless-stopped
