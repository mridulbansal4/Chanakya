<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="CHANAKYA — Regulatory Operating System">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="55%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="accentSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4c82f7" stop-opacity="0"/>
      <stop offset="35%" stop-color="#4c82f7" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#3fa97a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3fa97a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4c82f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4c82f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#1c1f25" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#canvas)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
    <ellipse cx="150" cy="150" rx="360" ry="260" fill="url(#glow)"/>

    <!-- ── Logo mark: the C, with the obligation graph inside ────────── -->
    <g transform="translate(50, 61) scale(0.34)" fill="none" stroke="#f2f4f7"
       stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M365 118 A170 170 0 1 0 365 394"/>
      <g stroke="#4c82f7" stroke-width="9" stroke-opacity="0.85">
        <line x1="170" y1="170" x2="255" y2="150"/>
        <line x1="255" y1="150" x2="330" y2="210"/>
        <line x1="170" y1="170" x2="190" y2="270"/>
        <line x1="190" y1="270" x2="300" y2="320"/>
        <line x1="300" y1="320" x2="330" y2="210"/>
        <line x1="190" y1="270" x2="255" y2="150"/>
      </g>
      <circle cx="170" cy="170" r="13" fill="#f2f4f7" stroke="none"/>
      <circle cx="255" cy="150" r="13" fill="#f2f4f7" stroke="none"/>
      <circle cx="330" cy="210" r="13" fill="#4c82f7" stroke="none"/>
      <circle cx="300" cy="320" r="13" fill="#3fa97a" stroke="none"/>
      <circle cx="190" cy="270" r="13" fill="#f2f4f7" stroke="none"/>
    </g>

    <!-- ── Wordmark ──────────────────────────────────────────────────── -->
    <text x="238" y="128" font-family="'Source Serif 4', 'Iowan Old Style', Georgia, serif"
          font-size="76" font-weight="600" fill="#f2f4f7" letter-spacing="6">CHANAKYA</text>

    <text x="242" y="168" font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace"
          font-size="16" font-weight="500" fill="#4c82f7" letter-spacing="5.2">REGULATORY OPERATING SYSTEM</text>

    <!-- accent rule under the wordmark -->
    <rect x="240" y="192" width="700" height="1.6" fill="url(#accentSweep)"/>

    <!-- ── The chain: what the product actually does ─────────────────── -->
    <g font-family="'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace"
       font-size="13.5" letter-spacing="1.4" fill="#a8b0bc">
      <text x="242" y="228">CIRCULAR</text>
      <text x="332" y="228" fill="#5a6373">→</text>
      <text x="356" y="228">CLAUSE</text>
      <text x="430" y="228" fill="#5a6373">→</text>
      <text x="454" y="228">OBLIGATION</text>
      <text x="566" y="228" fill="#5a6373">→</text>
      <text x="590" y="228" fill="#e0a215">HUMAN SIGN-OFF</text>
      <text x="740" y="228" fill="#5a6373">→</text>
      <text x="764" y="228" fill="#3fa97a">ENFORCED POLICY</text>
    </g>

    <text x="242" y="258" font-family="Inter, -apple-system, 'Segoe UI', sans-serif"
          font-size="14.5" fill="#7b8494">Bi-temporal. Cited at every step. Nothing enforced that a human did not sign.</text>

    <!-- ── Right rail: the invariant, stated as an instrument reading ── -->
    <g transform="translate(952, 60)">
      <rect x="0" y="0" width="176" height="180" rx="10" fill="#121317" stroke="#24282f"/>
      <text x="16" y="30" font-family="'JetBrains Mono', ui-monospace, monospace"
            font-size="10.5" letter-spacing="1.8" fill="#7b8494">SAFETY MODEL</text>
      <line x1="16" y1="42" x2="160" y2="42" stroke="#1c1f25"/>

      <g font-family="Inter, sans-serif" font-size="12.5" fill="#a8b0bc">
        <circle cx="22" cy="65" r="3.4" fill="#3fa97a"/>
        <text x="34" y="69">LLM emits data</text>
        <circle cx="22" cy="93" r="3.4" fill="#3fa97a"/>
        <text x="34" y="97">OPA enforces</text>
        <circle cx="22" cy="121" r="3.4" fill="#3fa97a"/>
        <text x="34" y="125">Ed25519 gate</text>
        <circle cx="22" cy="149" r="3.4" fill="#3fa97a"/>
        <text x="34" y="153">Read-only I/O</text>
      </g>
    </g>

    <rect x="0" y="0" width="1200" height="300" rx="14" fill="none" stroke="#24282f" stroke-width="2"/>
  </g>
</svg>
